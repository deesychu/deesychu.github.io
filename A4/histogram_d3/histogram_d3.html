<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Histogram in D3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body {
        font-family: Georgia, serif;
        background-color: #fff0f5;
        color: #5a2a3a;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        }

        h1 {
        font-size: 1.6rem;
        margin-bottom: 8px;
        color: #c2185b;
        }

        p.subtitle {
        font-size: 0.95rem;
        color: #a0566b;
        margin-bottom: 32px;
        }

        #chart {
        background: #fff;
        border: 1.5px solid #f8bbd0;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 16px rgba(194, 24, 91, 0.08);
        }

        .tick text {
        fill: #7b3a52;
        font-size: 0.78rem;
        font-family: Georgia, serif;
        }

        .tick line {
        stroke: #f8bbd0;
        }

        .domain {
        stroke: #f8bbd0;
        }

        .axis-label {
        fill: #a0566b;
        font-size: 0.85rem;
        font-family: Georgia, serif;
        }
    </style>
    </head>
    <body>

    <h1>Distribution of Review Lengths in Sephora Reviews - Histogram</h1>
    <p class="subtitle">D3 Hisotgram - Review text lengths of Sephora Reviews</p>
    <div id="chart"></div>

    <!-- Reference: https://observablehq.com/@d3/histogram/2 -->

    <script>
        const width = 960;
        const height = 500;
        const marginTop = 20;
        const marginRight = 30;
        const marginBottom = 50;
        const marginLeft = 60;

        // Tooltip
        const tooltip = d3.select("body").append("div")
        .style("position", "absolute")
        .style("background", "#fff")
        .style("border", "1.5px solid #f8bbd0")
        .style("border-radius", "8px")
        .style("padding", "8px 12px")
        .style("font-family", "Georgia, serif")
        .style("font-size", "0.8rem")
        .style("color", "#5a2a3a")
        .style("box-shadow", "0 4px 12px rgba(194,24,91,0.1)")
        .style("pointer-events", "none")
        .style("opacity", 0);

        d3.csv("/A4/data/compressed_file2.csv").then(rawData => {

        // Pull out review lengths, cap at 2000
        const data = rawData
            .filter(d => d.review_length > 0)
            .map(d => +d.review_length)
            .filter(len => len <= 2000);

        // Bin the data
        const bins = d3.bin()
            .thresholds(40)
            .value(d => d)
            (data);

        // x scale covers the full range of bins
        const x = d3.scaleLinear()
            .domain([bins[0].x0, bins[bins.length - 1].x1])
            .range([marginLeft, width - marginRight]);

        // y scale is count of reviews in each bin
        const y = d3.scaleLinear()
            .domain([0, d3.max(bins, d => d.length)]).nice()
            .range([height - marginBottom, marginTop]);

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [0, 0, width, height])
            .attr("style", "max-width: 100%; height: auto;");

        // One rect per bin
        svg.append("g")
            .selectAll("rect")
            .data(bins)
            .join("rect")
            .attr("x", d => x(d.x0) + 1)
            .attr("width", d => Math.max(0, x(d.x1) - x(d.x0) - 1))
            .attr("y", d => y(d.length))
            .attr("height", d => y(0) - y(d.length))
            .attr("fill", "#f48fb1")
            .attr("stroke", "#c2185b")
            .attr("stroke-width", 0.5)
            .style("cursor", "pointer")
            .on("mouseover", (event, d) => {
                var rangeLine = "<strong>" + d.x0 + "-" + d.x1 + " characters</strong><br/>";
                var countLine = "Reviews: " + d.length.toLocaleString();
                tooltip.style("opacity", 1).html(rangeLine + countLine);
            })
            .on("mousemove", event => {
                tooltip
                .style("left", (event.pageX + 14) + "px")
                .style("top",  (event.pageY - 28) + "px");
            })
            .on("mouseout", () => tooltip.style("opacity", 0));

        // X-axis
        svg.append("g")
            .attr("transform", "translate(0," + (height - marginBottom) + ")")
            .call(d3.axisBottom(x).ticks(width / 80).tickSizeOuter(0))
            .call(g => g.select(".domain").remove())
            .call(g => g.append("text")
            .attr("class", "axis-label")
            .attr("x", width - marginRight)
            .attr("y", marginBottom - 6)
            .attr("fill", "#a0566b")
            .attr("text-anchor", "end")
            .text("Review Length (characters) →"));

        // Y-axis
        svg.append("g")
            .attr("transform", "translate(" + marginLeft + ",0)")
            .call(d3.axisLeft(y).ticks(height / 40))
            .call(g => g.select(".domain").remove())
            .call(g => g.append("text")
            .attr("class", "axis-label")
            .attr("x", -marginLeft)
            .attr("y", 10)
            .attr("fill", "#a0566b")
            .attr("text-anchor", "start")
            .text("↑ Number of Reviews"));

        document.getElementById("chart").appendChild(svg.node());
        });
    </script>

    <hr>
    <a href="/index.html">Go back to homepage</a>

</body>
</html>
