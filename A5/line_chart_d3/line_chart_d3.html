<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Line Chart in D3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body {
        font-family: Georgia, serif;
        background-color: #fff0f5;
        color: #5a2a3a;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        }

        h1 {
        font-size: 1.6rem;
        margin-bottom: 8px;
        color: #c2185b;
        }

        p.subtitle {
        font-size: 0.95rem;
        color: #a0566b;
        margin-bottom: 32px;
        }

        #chart {
        background: #fff;
        border: 1.5px solid #f8bbd0;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 16px rgba(194, 24, 91, 0.08);
        }

        .tick text {
        fill: #7b3a52;
        font-size: 0.78rem;
        font-family: Georgia, serif;
        }

        .tick line {
        stroke: #f8bbd0;
        }

        .domain {
        stroke: #f8bbd0;
        }

        .axis-label {
        fill: #a0566b;
        font-size: 0.85rem;
        font-family: Georgia, serif;
        }
    </style>
    </head>
    <body>

    <h1>Average Monthly Rating by Skin Type (2016–2023) - Line Chart</h1>
    <p class="subtitle">This chart shows how Sephora reviewers based on their skin type have rated products over time. Hover to isolate a line.</p>
    <div id="chart"></div>

    <!-- Reference: https://observablehq.com/@d3/multi-line-chart -->

    <script>
        // Chart dimensions and margins
        const width        = 928;
        const height       = 500;
        const marginTop    = 30;
        const marginRight  = 40; 
        const marginBottom = 40;
        const marginLeft   = 50;

        // Skin types to display
        const skinTypes = ["combination", "dry", "normal", "oily"];

        const colorMap = {
        combination: "#c2185b",
        dry:         "#9c27b0",
        normal:      "#1976d2",
        oily:        "#f48fb1"
        };

        // Tooltip div
        const tooltip = d3.select("body").append("div")
        .style("position", "absolute")
        .style("background", "#fff")
        .style("border", "1.5px solid #f8bbd0")
        .style("border-radius", "8px")
        .style("padding", "8px 12px")
        .style("font-family", "Georgia, serif")
        .style("font-size", "0.8rem")
        .style("color", "#5a2a3a")
        .style("box-shadow", "0 4px 12px rgba(194,24,91,0.1)")
        .style("pointer-events", "none")
        .style("opacity", 0);

        // Parse YYYY-MM-DD
        const parseDate = d3.timeParse("%Y-%m-%d");

        d3.csv("/A5/data/reviews_750-1250.csv").then(rawData => {

        // Filter to 2016+ and valid rows only
        const filtered = rawData.filter(d =>
            d.submission_time && d.rating && d.skin_type &&
            skinTypes.includes(d.skin_type) &&
            d.submission_time >= "2016-01-01"
        );

        // Aggregate avg rating per skin type per month
        const nested = d3.rollup(
            filtered,
            v => d3.mean(v, d => +d.rating),
            d => d.skin_type,
            d => d.submission_time.slice(0, 7)
        );

        // Build one series object per skin type: { skinType, values: [{date, avg}] }
        const series = skinTypes.map(skin => {
            var monthMap = nested.get(skin) || new Map();
            var values = Array.from(monthMap, ([monthStr, avg]) => ({
            date: parseDate(monthStr + "-01"),
            avg:  avg
            })).sort((a, b) => a.date - b.date);
            return { skinType: skin, values };
        });

        // x scale — time axis
        const x = d3.scaleUtc()
            .domain(d3.extent(filtered, d => parseDate(d.submission_time)))
            .range([marginLeft, width - marginRight]);

        // y scale — rating, starting at 2.0
        const y = d3.scaleLinear()
            .domain([2, 5]).nice()
            .range([height - marginBottom, marginTop]);

        // Flatten all points to [px, py, skinType, dataPoint] for nearest-point lookup
        const points = [];
        series.forEach(s => {
            s.values.forEach(v => {
            points.push([x(v.date), y(v.avg), s.skinType, v]);
            });
        });

        // Line generator — x maps to date, y maps to avg rating
        const line = d3.line()
            .x(d => x(d.date))
            .y(d => y(d.avg))
            .defined(d => d.date && !isNaN(d.avg));

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [0, 0, width, height])
            .attr("style", "max-width: 100%; height: auto; overflow: visible;");

        // Y-axis with grid lines
        svg.append("g")
            .attr("transform", "translate(" + marginLeft + ",0)")
            .call(d3.axisLeft(y).ticks(height / 40))
            .call(g => g.select(".domain").remove())
            .call(g => g.selectAll(".tick line").clone()
            .attr("x2", width - marginLeft - marginRight)
            .attr("stroke", "#f8bbd0")
            .attr("stroke-opacity", 0.6))
            .call(g => g.append("text")
            .attr("class", "axis-label")
            .attr("x", -marginLeft)
            .attr("y", 15)
            .attr("fill", "#a0566b")
            .attr("text-anchor", "start")
            .text("↑ Average Rating (1.0 - 5.0)"));

        // X-axis
        svg.append("g")
            .attr("transform", "translate(0," + (height - marginBottom) + ")")
            .call(d3.axisBottom(x).ticks(width / 80).tickSizeOuter(0))
            .call(g => g.select(".domain").remove())
            .call(g => g.append("text")
            .attr("class", "axis-label")
            .attr("x", width - marginRight)
            .attr("y", marginBottom - 4)
            .attr("fill", "#a0566b")
            .attr("text-anchor", "end")
            .text("Date →"));

        // Draw lines
        const path = svg.append("g")
            .attr("fill", "none")
            .attr("stroke-width", 2)
            .attr("stroke-linejoin", "round")
            .attr("stroke-linecap", "round")
            .selectAll("path")
            .data(series)
            .join("path")
            .attr("stroke", d => colorMap[d.skinType])
            .style("mix-blend-mode", "multiply")
            .attr("d", d => line(d.values));

        // Dot that follows the cursor
        const dot = svg.append("g")
            .attr("display", "none");

        dot.append("circle")
            .attr("r", 4)
            .attr("fill", "#c2185b");

        dot.append("text")
            .attr("text-anchor", "middle")
            .attr("y", -10)
            .attr("font-family", "Georgia, serif")
            .attr("font-size", "0.78rem")
            .attr("fill", "#5a2a3a");

        // Attach pointer events to the SVG
        svg
            .on("pointerenter", pointerentered)
            .on("pointermove", pointermoved)
            .on("pointerleave", pointerleft)
            .on("touchstart", event => event.preventDefault());

        document.getElementById("chart").appendChild(svg.node());

        // pointermoved: find closest point, isolate its line, show tooltip
        function pointermoved(event) {
            var coords    = d3.pointer(event);
            var xm        = coords[0];
            var ym        = coords[1];

            // Find index of the closest point to the cursor
            var i = d3.leastIndex(points, function(p) {
            return Math.hypot(p[0] - xm, p[1] - ym);
            });

            var px        = points[i][0];
            var py        = points[i][1];
            var skinType  = points[i][2];
            var pointData = points[i][3];

            // Fade all lines to grey, highlight the closest one
            path
            .style("stroke", function(d) {
                return d.skinType === skinType ? colorMap[d.skinType] : "#ddd";
            })
            .filter(function(d) { return d.skinType === skinType; })
            .raise();  

            dot.attr("display", null)
            .attr("transform", "translate(" + px + "," + py + ")");
            dot.select("circle").attr("fill", colorMap[skinType]);
            dot.select("text").text(skinType);

            var dateLine   = "<strong>" + d3.timeFormat("%b %Y")(pointData.date) + "</strong><br/>";
            var skinLine   = "Skin type: " + skinType + "<br/>";
            var ratingLine = "Avg rating: " + pointData.avg.toFixed(2);
            tooltip.style("opacity", 1)
            .html(dateLine + skinLine + ratingLine)
            .style("left", (event.pageX + 14) + "px")
            .style("top",  (event.pageY - 28) + "px");
        }

        // pointerentered: fade all lines to grey so hovered line stands out
        function pointerentered() {
            path.style("mix-blend-mode", null).style("stroke", "#ddd");
            dot.attr("display", null);
        }

        // pointerleft: restore all lines to their original colors
        function pointerleft() {
            path
            .style("mix-blend-mode", "multiply")
            .style("stroke", function(d) { return colorMap[d.skinType]; });
            dot.attr("display", "none");
            tooltip.style("opacity", 0);
        }

        });
    </script>

    <hr>
    <a href="/index.html">Go back to homepage</a>

</body>
</html>
