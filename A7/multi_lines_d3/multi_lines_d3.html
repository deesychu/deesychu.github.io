<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Multi Line Chart</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #fff0f5;
            color: #5a2a3a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #c2185b;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #a0566b;
            margin-bottom: 32px;
            text-align: center;
            max-width: 700px;
        }

        #chart {
            background: #fff;
            border: 1.5px solid #f8bbd0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(194, 24, 91, 0.08);
        }

        .tick text {
            fill: #7b3a52;
            font-size: 0.75rem;
            font-family: Georgia, serif;
        }

        .domain {
            stroke: #f8bbd0;
        }

        .axis-label {
            fill: #a0566b;
            font-size: 0.85rem;
            font-family: Georgia, serif;
        }

        .legendOrdinal text {
            fill: #5a2a3a;
            font-family: Georgia, serif;
            font-size: 13px;
        }

        /* Simple tooltip */
        #tooltip {
            position: absolute;
            pointer-events: none;
            background: #fff;
            border: 1.5px solid #f8bbd0;
            border-radius: 8px;
            padding: 8px 12px;
            font-family: Georgia, serif;
            font-size: 0.8rem;
            color: #5a2a3a;
            box-shadow: 0 4px 12px rgba(194, 24, 91, 0.1);
            opacity: 0;
        }
    </style>
</head>
<body>

    <h1>Avg. Review Helpfulness Over Time by Hair Color</h1>
    <p class="subtitle">
        Each line tracks the average review helpfulness score (0–1) per year
        for reviewers grouped by hair color (2017–2023) using a
        <strong>Qualitative Pastel1 (ColorBrewer)</strong> scale. Hover over a dot to see the exact value.
    </p>
    <div id="chart"></div>
    <div id="tooltip"></div>

    <!--
        References:
        - D3 multi-line chart: https://observablehq.com/@d3/multi-line-chart
        - Qualitative color scale Pastel1 (ColorBrewer): https://colorbrewer2.org/#type=qualitative&scheme=Pastel1
        - d3-legend by Susie Lu: https://d3-legend.susielu.com/
    -->

    <script>
        // Chart dimensions
        const width        = 820;
        const height       = 560;
        const marginTop    = 30;
        const marginRight  = 40;
        const marginBottom = 140;
        const marginLeft   = 70;

        const HAIR_COLORS = ["black", "blonde", "brown", "auburn"];
        const YEARS       = ["2017", "2018", "2019", "2020", "2021", "2022", "2023"];

        // Simple tooltip div
        const tooltip = d3.select("#tooltip");

        d3.csv("/A7/data/compressed_file2.csv").then(rawData => {

            // Filter to valid rows with known hair color and year in range
            const filtered = rawData.filter(d =>
                d.hair_color &&
                HAIR_COLORS.includes(d.hair_color) &&
                d.submission_time &&
                YEARS.includes(d.submission_time.slice(0, 4)) &&
                d.helpfulness !== ""
            );

            // Aggregate: avg helpfulness per (year, hair_color)
            const rollup = d3.rollup(
                filtered,
                v => d3.mean(v, d => +d.helpfulness),
                d => d.submission_time.slice(0, 4),
                d => d.hair_color
            );

            // Build one series per hair color
            const series = HAIR_COLORS.map(hc => ({
                hair_color: hc,
                values: YEARS.map(yr => ({
                    year:      yr,
                    hair_color: hc,
                    avg:       (rollup.get(yr) && rollup.get(yr).get(hc)) ?? null
                })).filter(d => d.avg !== null)
            }));

            // X scale — years as a point scale
            const x = d3.scalePoint()
                .domain(YEARS)
                .range([marginLeft, width - marginRight])
                .padding(0.3);

            // Y scale — avg helpfulness
            const allVals = series.flatMap(s => s.values.map(d => d.avg));
            const y = d3.scaleLinear()
                .domain([d3.min(allVals) * 0.97, d3.max(allVals) * 1.02]).nice()
                .range([height - marginBottom, marginTop]);

            const colorScale = d3.scaleOrdinal()
                .domain(HAIR_COLORS)
                .range(d3.schemePastel1);

            const svg = d3.create("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("viewBox", [0, 0, width, height])
                .attr("style", "max-width: 100%; height: auto;");

            // Horizontal gridlines
            svg.append("g")
                .attr("transform", `translate(${marginLeft},0)`)
                .call(
                    d3.axisLeft(y)
                        .ticks(6)
                        .tickSize(-(width - marginLeft - marginRight))
                        .tickFormat("")
                )
                .call(g => g.select(".domain").remove())
                .call(g => g.selectAll(".tick line")
                    .attr("stroke", "#f8bbd0")
                    .attr("stroke-opacity", 0.6));

            // X-axis
            svg.append("g")
                .attr("transform", `translate(0,${height - marginBottom})`)
                .call(d3.axisBottom(x).tickSizeOuter(0))
                .call(g => g.select(".domain").attr("stroke", "#f8bbd0"))
                .call(g => g.append("text")
                    .attr("class", "axis-label")
                    .attr("x", (width - marginLeft - marginRight) / 2 + marginLeft)
                    .attr("y", 40)
                    .attr("text-anchor", "middle")
                    .text("Year of Review Submission"));

            // Y-axis
            svg.append("g")
                .attr("transform", `translate(${marginLeft},0)`)
                .call(d3.axisLeft(y).ticks(6).tickFormat(d3.format(".2f")))
                .call(g => g.select(".domain").remove())
                .call(g => g.append("text")
                    .attr("class", "axis-label")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -((height - marginTop - marginBottom) / 2 + marginTop))
                    .attr("y", -marginLeft + 14)
                    .attr("text-anchor", "middle")
                    .text("Avg. Review Helpfulness Score (0–1)"));

            // Line generator
            const line = d3.line()
                .x(d => x(d.year))
                .y(d => y(d.avg))
                .curve(d3.curveMonotoneX);

            // Draw one line per hair color
            svg.append("g")
                .selectAll("path")
                .data(series)
                .join("path")
                .attr("fill",            "none")
                .attr("stroke",          d => colorScale(d.hair_color))
                .attr("stroke-width",    2.5)
                .attr("stroke-linejoin", "round")
                .attr("stroke-linecap",  "round")
                .attr("d",               d => line(d.values));

            // Dots at each data point with simple mouseover tooltip
            series.forEach(s => {
                svg.append("g")
                    .selectAll("circle")
                    .data(s.values)
                    .join("circle")
                    .attr("cx",           d => x(d.year))
                    .attr("cy",           d => y(d.avg))
                    .attr("r",            5)
                    .attr("fill",         colorScale(s.hair_color))
                    .attr("stroke",       "#c2185b")
                    .attr("stroke-width", 0.8)
                    .on("mouseover", function(event, d) {
                        tooltip
                            .style("opacity", 1)
                            .html(`<strong>${d.hair_color}</strong><br/>Year: ${d.year}<br/>Helpfulness: ${d.avg.toFixed(3)}`);
                        d3.select(this).attr("r", 8);
                    })
                    .on("mousemove", function(event) {
                        tooltip
                            .style("left", (event.pageX + 12) + "px")
                            .style("top",  (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function() {
                        tooltip.style("opacity", 0);
                        d3.select(this).attr("r", 5);
                    });
            });

            // QUALITATIVE COLOR LEGEND using Susie Lu's d3-legend
            const legendOrdinal = d3.legendColor()
                .shape("circle")
                .shapeRadius(7)
                .shapePadding(120)
                .orient("horizontal")
                .scale(colorScale)
                .title("Reviewer Hair Color")
                .labelOffset(15);

            svg.append("g")
                .attr("class", "legendOrdinal")
                .attr("transform", `translate(${marginLeft}, ${height - 65})`)
                .call(legendOrdinal);

            document.getElementById("chart").appendChild(svg.node());
        });
    </script>

    <hr>
    <a href="/index.html">Go back to homepage</a>

</body>
</html>
